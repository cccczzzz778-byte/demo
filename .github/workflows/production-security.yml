name: Production security gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Focused security tests
        run: bun test tests/rbac-store.test.ts tests/admin-monitor-store.test.ts tests/super-admin-api.test.ts

      - name: Full test suite
        run: bun test
