name: Bitiruvchilar security

on:
  push:
    branches: [bitiruvchilar-admin-prod]
    paths:
      - 'bitiruvchilar-admin/**'
      - '.github/workflows/bitiruvchilar-security.yml'
  pull_request:
    paths:
      - 'bitiruvchilar-admin/**'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitiruvchilar-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bitiruvchilar-admin/package-lock.json
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high
